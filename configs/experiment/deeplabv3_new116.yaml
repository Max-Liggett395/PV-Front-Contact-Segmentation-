# DeepLabV3 ResNet50 on new dataset (116 images), 1000 epochs
data: data/new_116
model: model/deeplabv3_resnet50

data_overrides:
  batch_size: 2

training:
  max_epochs: 1000
  device: auto
  mixed_precision: true
  monitor: val_loss
  monitor_mode: min
  patience: 300
  min_delta: 0.0

optimizer:
  type: adam
  lr: 0.00005
  weight_decay: 0.0

scheduler: null

loss:
  type: ce
  class_weights: [1.0, 1.0, 1.5, 1.0, 1.5, 1.5]
