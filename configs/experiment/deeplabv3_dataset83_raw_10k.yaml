# DeepLabV3 ResNet50 on dataset_83 — raw mode (no augmentation, no normalization)
# 10,000 epoch run to match notebook-level training
data: data/dataset_83
model: model/deeplabv3_resnet50

data_overrides:
  batch_size: 2
  raw_mode: true

training:
  max_epochs: 10000
  device: auto
  mixed_precision: false
  monitor: val_loss
  monitor_mode: min
  patience: 9999
  min_delta: 0.0

optimizer:
  type: adam
  lr: 0.00005
  weight_decay: 0.0

scheduler: null

loss:
  type: ce
  class_weights: [1.0, 1.0, 1.5, 1.0, 1.5, 1.5]
